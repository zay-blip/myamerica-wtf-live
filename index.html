<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MyAmerica.WTF</title>
<meta name="theme-color" content="#050910"/>
<meta name="description" content="MyAmerica.WTF — under construction. Contact Zay at mycountry."/>
<style>
  html,body{margin:0;padding:0;background:#050910;color:#e8eef6;font-family:system-ui,-apple-system,sans-serif;min-height:100%;}
  .wrap{max-width:480px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;align-items:center;gap:20px;}
  video{width:100%;max-height:85vh;border-radius:12px;background:#000;display:block;}
  .uc{width:100%;border:2px solid #e2b44a;border-radius:12px;overflow:hidden;background:rgba(8,12,18,.92);}
  .uc-bar{height:10px;background:repeating-linear-gradient(135deg,#e2b44a 0 12px,#111 12px 24px);}
  .uc-body{padding:14px 16px;text-align:center;}
  .uc-body p{margin:0 0 6px;color:#e2b44a;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;}
  .contact{margin:0;text-align:center;font-size:15px;line-height:1.5;color:#e8eef6;}
  .contact a{color:#e2b44a;text-decoration:none;font-weight:700;}
  .contact a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <main class="wrap">
    <video
      src="/videos/MyAmericaWTF_intro_mobile_v3.mp4"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      controls
      poster=""
      aria-label="MyAmerica.WTF intro"
    ></video>
    <aside class="uc" role="status" aria-label="Under construction">
      <div class="uc-bar"></div>
      <div class="uc-body"><p>Under Construction</p></div>
      <div class="uc-bar"></div>
    </aside>
    <p class="contact">Contact Zay at <a href="https://mycountry.wtf">mycountry</a></p>
  </main>
</body>
</html>
