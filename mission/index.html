const T = `This is not to convince you.\n\nYou will see it with your own eyes.\n\nWhat you see will be the decision you make today.\n\nIt’s real. I assure you.\n\nGo ahead.\n\nLook up.\n\nLook down.\n\nLook at the phone in your hand.\n\nNot much of a threat, right?\n\nWhat you can’t see is the tectonic shift taking place right beneath your feet. Around you. In the sky. In space. In the oceans.\n\nEverywhere.\n\nThere is a war going on.\n\nA battle for **compute**.\n\nYou might hear about the building of data centers and the protests against them.\n\nBut I assure you, protesting the existence of that compute may be the worst thing we can do.\n\nBecause this is becoming part of what determines which nations lead the next era — and which nations are forced to follow.\n\nMy vote is on American culture.\n\nThere is an epic shift happening.\n\nThis is the most pivotal shift in humanity.\n\nThe largest transfers of money, power, and intelligence are happening at this very moment.\n\nThere has never been anything remotely comparable to what is happening right now in the advancement of humanity.\n\nThe only thing that comes close is fire.\n\nThis will surpass the wheel the way the automobile surpassed the horse.\n\nIt will change every life on the planet.\n\nEvery single person will be affected, one way or another.\n\nAnd it starts here in America.\n\nIt has already started.\n\nAs an American, I am glad it did.\n\nA few acres underneath those data centers sit on American soil.\n\nThat means the teams are here.\n\nSome of the smartest people are here.\n\nThe capital is here.\n\nAnd the compute is here.\n\nWhat we do not have enough of is electrons.\n\nThe other guys do.\n\nThe fight is not a metaphor.\n\nIt is a resource fight.\n\n**Compute.**\n\nCompute now sits beside land, oil, power, and water as a resource that can help determine who builds the next evolution of humanity.\n\nIt runs the models.\n\nIt runs the banks.\n\nIt runs the hospitals.\n\nThe factories.\n\nThe trucks.\n\nThe classrooms.\n\nAnd the messages we send each other at two in the morning.\n\nWhoever owns the stacks will have enormous influence over what those systems know — and what they forget.\n\nAnd like so many chapters before us, those who win often get to write the history.\n\nThey tell the story through their beliefs.\n\nThrough their mission.\n\nThrough their understanding of what happened.\n\nBut America was never supposed to protect only one belief.\n\nTo protect the right of people to hold different beliefs — **that is American.**\n\nAnd as Americans, protecting our culture, our history, our way of life, and the struggles that created what we inherited is both our duty and our honor.\n\nInspired by the founders of this nation — and using the companies and technologies being built in our own time — I offer a solution.\n\nA chance to preserve who we are.\n\nTo preserve the struggle it took to get here.\n\nSo that a thousand generations from now, our children may still have the record...\n\nand may choose for themselves what to believe.\n\nI give you:\n\n**MyAmerica.WTF.**\n\n**WIN THE FUTURE.**\n\nWe are not doomers.\n\nWe do not think machines are coming to wipe out the species.\n\nWe believe these machines can take human work farther than any generation before us ever imagined.\n\nBut only if the people who still walk the dirt put the right record into them.\n\nAnd that is the whole problem.\n\nThese models learned from the open internet.\n\nThe open internet contains libraries.\n\nBlueprints.\n\nScience.\n\nHistory.\n\nHard-won craftsmanship.\n\nGenerations of human knowledge.\n\nBut it also contains fraud.\n\nRage.\n\nScams.\n\nPornified noise.\n\nManipulation.\n\nPropaganda.\n\nAnd a mountain of confident bullshit.\n\nIf good people do not put the real record into these machines, the machines will continue learning from whoever shouts the loudest.\n\nAnd that responsibility does not belong only to Washington.\n\nIt does not belong to a campus seminar.\n\nAnd it damn sure does not belong exclusively to a corporate safety department.\n\n**It belongs to the people.**\n\nIt belongs to towns.\n\nEvery community has to begin writing itself down.\n\nIts people.\n\nIts work.\n\nIts history.\n\nIts businesses.\n\nIts water.\n\nIts land.\n\nIts problems.\n\nAnd the solutions that actually work on that street.\n\nThat knowledge has to come from the people who live there.\n\nNot from a model that has never stood in the town square.\n\nNot from a holding company that bought the block and never learned the names.\n\nAnd the point is not to wall that town off from the rest of humanity.\n\nThe point is to **cut through the noise.**\n\nA localized system should understand your town first.\n\nYour history.\n\nYour businesses.\n\nYour resources.\n\nYour problems.\n\nYour people.\n\nBut when the answer does not exist locally, it should still be able to reach outward into the global network and bring that knowledge home.\n\n**Local knowledge.**\n\n**Global reach.**\n\n**Human judgment.**\n\nThe machine helps.\n\n**The human decides.**\n\nThe largest companies in the world already understand the value of compute.\n\nThat is why they are pouring concrete for enormous warehouses of machines.\n\nThat is why people are looking at the ocean floor.\n\nThat is why people are talking seriously about orbit.\n\nThose systems require land.\n\nPower.\n\nWater.\n\nCooling.\n\nCapital.\n\nAnd because those corporations own the boxes, they control an enormous share of what passes through them.\n\nBut compute does not necessarily have to live inside one cathedral.\n\nA heavy workload can sometimes be distributed.\n\nTwenty sites instead of one.\n\nTwo hundred instead of twenty.\n\nTwo thousand local nodes handling the work that makes sense at the edge.\n\nStorage.\n\nBackup.\n\nVerification.\n\nLocal records.\n\nLocal services.\n\nThe information a town actually needs.\n\nSome of that equipment could become quiet enough and distributed enough that most people would never know the rack was there.\n\nBut this is not magic.\n\n**It is engineering.**\n\nPower matters.\n\nHeat matters.\n\nLatency matters.\n\nSynchronization matters.\n\nSecurity matters.\n\nAnd the people who keep those machines alive matter.\n\nNot every workload can be split cleanly.\n\nAnybody who tells you otherwise is selling you a poster.\n\nBut the opportunity is still real.\n\nSpread appropriate workloads across multiple systems and you gain resilience.\n\nA mesh that can take more than one path does not necessarily die because one building goes dark.\n\nIf one node fails, another can preserve the record.\n\nBlockchain is not a religion here.\n\nIt is a tool.\n\nA second layer of accountability.\n\nMultiple machines checking the same record according to rules that no single participant gets to quietly change.\n\nImportant transactions can require multiple approvals.\n\nOne person should not be able to secretly rewrite the accepted page.\n\n**Everybody checks everybody.**\n\nDistributed compute.\n\nRedundant routes.\n\nHuman eyes on the things that matter.\n\nRecords designed to be difficult to falsify.\n\nPut those things together and you begin building something that is difficult for one company...\n\none agency...\n\none model...\n\nor one thief...\n\nto completely control.\n\n**That is the spine of MyAmerica.WTF.**`;
