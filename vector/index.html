<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Vector Sphere — MyAmerica.WTF</title><link rel="icon" href="/favicon.svg"/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Outfit:wght@700;800&display=swap"/><style>html,body{margin:0;height:100%;background:#03060c;color:#e8eef6;font-family:IBM Plex Sans,sans-serif;overflow:hidden}header{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 16px}header img{height:34px}header a{color:#e2b44a;text-decoration:none;font-family:Outfit,sans-serif;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}#stage{width:100%;height:100%;cursor:grab}aside{position:absolute;right:12px;top:64px;bottom:12px;width:min(360px,92vw);background:rgba(8,14,24,.88);border:1px solid rgba(226,180,74,.28);border-radius:14px;padding:14px;overflow:auto}.k{color:#e2b44a;font-family:Outfit,sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase}h1{font-family:Outfit,sans-serif;font-size:1.15rem}#quote{white-space:pre-wrap;line-height:1.5}.links a{display:inline-block;margin:8px 8px 0 0;background:#e2b44a;color:#141108;text-decoration:none;padding:.4rem .75rem;border-radius:999px;font-family:Outfit,sans-serif;font-size:11px;font-weight:800;text-transform:uppercase}.links a.g{background:transparent;color:#e8eef6;border:1px solid rgba(226,180,74,.35)}@media(max-width:800px){aside{top:auto;left:12px;right:12px;bottom:0;height:38%;width:auto}}</style></head><body><header><a href="/"><img src="/images/logo-2026.png" alt="MyAmerica.WTF"/></a><a href="/">Map globe</a><a href="/mission">Mission 1</a></header><canvas id="stage"></canvas><aside><p class="k">Vector sphere · not the front globe</p><h1 id="title">The spine</h1><p id="kind">connection</p><div id="quote">Click a node. Drag it. Scroll to zoom. Lines are the connections in Mission 1.</div><div class="links"><a href="/mission">Read Mission 1</a><a class="g" href="/">Leave this sphere</a></div></aside><script>
const N=[
{id:'mission',label:'Mission 1',kind:'mission',x:0,y:-40,q:'A Declaration to the American People\nThis is not to convince you.\nYou will see it with your own eyes.'},
{id:'compute',label:'Compute',kind:'need',x:-220,y:-160,q:'There is a war going on.\nA battle for compute.\nThe fight is not a metaphor.\nIt is a resource fight.'},
{id:'electrons',label:'Electrons',kind:'need',x:-300,y:20,q:'The teams are here. The capital is here. The compute is here.\nWhat we do not have enough of is electrons.\nThe other guys do.'},
{id:'culture',label:'American culture',kind:'destination',x:40,y:-210,q:'My vote is on American culture.\nTo protect the right of people to hold different beliefs \u2014 that is American.'},
{id:'problem',label:'The whole problem',kind:'problem',x:240,y:-80,q:'And that is the whole problem.\nIf good people do not put the real record into these machines, the machines will continue learning from whoever shouts the loudest.'},
{id:'people',label:'It belongs to the people',kind:'solution',x:280,y:80,q:'It belongs to the people.\nIt belongs to towns.'},
{id:'record',label:'Write the town down',kind:'solution',x:160,y:200,q:'Every community has to begin writing itself down.\nIts people. Its work. Its history. Its businesses. Its water. Its land. Its problems.\nAnd the solutions that actually work on that street.'},
{id:'local',label:'Local / Global / Human',kind:'connection',x:-20,y:210,q:'Local knowledge.\nGlobal reach.\nHuman judgment.\nThe machine helps.\nThe human decides.'},
{id:'cathedral',label:'Not one cathedral',kind:'problem',x:-260,y:180,q:'Compute does not necessarily have to live inside one cathedral.\nTwenty sites instead of one. Two hundred instead of twenty. Two thousand local nodes.'},
{id:'mesh',label:'Mesh + record',kind:'solution',x:-160,y:80,q:'A mesh that can take more than one path does not necessarily die because one building goes dark.\nBlockchain is not a religion here. It is a tool.\nEverybody checks everybody.'},
{id:'spine',label:'The spine',kind:'connection',x:0,y:0,q:'That is the spine of MyAmerica.WTF.'},
{id:'future',label:'WIN THE FUTURE',kind:'destination',x:200,y:-200,q:'I give you:\nMyAmerica.WTF.\nWIN THE FUTURE.'}
];
const L=[['mission','compute'],['mission','culture'],['mission','future'],['mission','spine'],['compute','electrons'],['compute','cathedral'],['compute','problem'],['problem','people'],['people','record'],['record','local'],['local','mesh'],['cathedral','mesh'],['mesh','spine'],['spine','future'],['culture','future'],['electrons','cathedral']];
const C={mission:'#e2b44a',problem:'#ef4b4b',solution:'#3dd68c',need:'#3ec6f0',destination:'#c9a227',connection:'#4d8dff'};
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
let W,H,dpr=1,scale=1,ox=0,oy=0,drag=null,pan=null,hover=null,sel='spine';
const nodes=N.map(n=>({...n,vx:0,vy:0}));
const by=Object.fromEntries(nodes.map(n=>[n.id,n]));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth=innerWidth;H=canvas.clientHeight=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);
function world(x,y){return{x:(x-W/2-ox)/scale,y:(y-H/2-oy)/scale}}
function hit(x,y){const w=world(x,y);let b=null,bd=1e9;for(const n of nodes){const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<30&&d<bd){b=n;bd=d}}return b}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);const n=hit(e.clientX,e.clientY);if(n){drag={n,id:e.pointerId};pick(n)}else pan={x:e.clientX,y:e.clientY,ox,oy,id:e.pointerId}};
canvas.onpointermove=e=>{hover=hit(e.clientX,e.clientY);if(drag&&drag.id===e.pointerId){const w=world(e.clientX,e.clientY);drag.n.x=w.x;drag.n.y=w.y;drag.n.vx=0;drag.n.vy=0}else if(pan&&pan.id===e.pointerId){ox=pan.ox+(e.clientX-pan.x);oy=pan.oy+(e.clientY-pan.y)}};
canvas.onpointerup=()=>{drag=pan=null};
canvas.addEventListener('wheel',e=>{e.preventDefault();const w=world(e.clientX,e.clientY);scale=Math.min(2.4,Math.max(.45,scale*(e.deltaY<0?1.08:.92)));ox=e.clientX-W/2-w.x*scale;oy=e.clientY-H/2-w.y*scale},{passive:false});
function pick(n){sel=n.id;title.textContent=n.label;kind.textContent=n.kind;quote.textContent=n.q.replaceAll('\\n','\n')}
pick(by.spine);
function step(){for(const [a,b] of L){const A=by[a],B=by[b],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,k=(d-170)*0.008,fx=dx/d*k,fy=dy/d*k;A.vx+=fx;A.vy+=fy;B.vx-=fx;B.vy-=fy}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const A=nodes[i],B=nodes[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1;if(d<140){const f=(140-d)*0.02,fx=dx/d*f,fy=dy/d*f;A.vx-=fx;A.vy-=fy;B.vx+=fx;B.vy+=fy}}for(const n of nodes){if(drag&&drag.n===n)continue;n.vx+=-n.x*0.002;n.vy+=-n.y*0.002;n.vx*=.86;n.vy*=.86;n.x+=n.vx;n.y+=n.vy}}
function draw(){step();ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2+ox,H/2+oy);ctx.scale(scale,scale);ctx.beginPath();for(let i=0;i<3;i++)ctx.arc(0,0,90+i*70,0,Math.PI*2);ctx.strokeStyle='rgba(62,198,240,.12)';ctx.stroke();
for(const [a,b] of L){const A=by[a],B=by[b],hot=sel===a||sel===b;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle=hot?'rgba(226,180,74,.75)':'rgba(77,141,255,.35)';ctx.lineWidth=hot?2.2:1.1;ctx.stroke()}
for(const n of nodes){const r=n.id==='spine'?26:18,on=sel===n.id||(hover&&hover.id===n.id);ctx.beginPath();ctx.arc(n.x,n.y,r+(on?4:0),0,Math.PI*2);ctx.fillStyle=C[n.kind];ctx.fill();ctx.font='700 12px Outfit,sans-serif';ctx.fillStyle='#e8eef6';ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+r+16)}ctx.restore();requestAnimationFrame(draw)}draw();
</script></body></html>
